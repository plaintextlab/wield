name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        shell: pwsh
        run: |
          cargo test --locked 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) {
            # Surface failures as annotations (visible without signing in).
            Select-String -Path test.log -Pattern 'panicked at|FAILED|left:|right:|assertion|not in' | ForEach-Object { "::error::$($_.Line.Trim())" }
            exit 1
          }
      - name: Build release
        run: cargo build --release --locked
      - name: Build installer
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          ./installer/build.ps1 -Version $v
          "VERSION=$v" | Out-File -Append $env:GITHUB_ENV
      - name: Test installer (silent install + uninstall)
        shell: pwsh
        run: ./installer/smoke-test.ps1 -Setup "dist/wield-v$env:VERSION-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: wield-${{ github.sha }}
          path: |
            target/release/wield.exe
            dist/*.exe
          retention-days: 14
